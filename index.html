<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💬 로그 생성기 V11</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }

      :root {
        --bg-color: #f3f4f6;
        --panel-bg: #ffffff;
        --input-bg: #f9fafb;
        --border: #e5e7eb;
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --accent: #3b82f6;
        --shadow: rgba(0, 0, 0, 0.05);
        --bubble-font-size: 15px;
        --bubble-max-width: 90%;
        --bubble-font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      }

      /* Editor Dark Mode */
      body.editor-dark {
        --bg-color: #1a1b1e;
        --panel-bg: #25262b;
        --input-bg: #2c2e33;
        --border: #373a40;
        --text-main: #c1c2c5;
        --text-sub: #909296;
        --accent: #4c6ef5;
        --shadow: rgba(0, 0, 0, 0.3);
      }
      body.editor-dark .preview-panel { background-color: #2c2e33; }
      body.editor-dark .btn-bread { background-color: #2c2e33; border-color: #373a40; }
      body.editor-dark .btn-bread:hover { background-color: #373a40; }
      body.editor-dark .keyword-group { background: #2c2e33; }
      body.editor-dark .keyword-row input { background: #25262b; }
      body.editor-dark .helper-bar button { background: #2c2e33; border-color: #4c6ef5; color: #748ffc; }
      body.editor-dark .helper-bar button:hover { background: #373a40; }
      body.editor-dark .btn-add { background: #2c2e33; border-color: #373a40; color: #909296; }
      body.editor-dark .settings-group { background: #2c2e33; }
      body.editor-dark .syntax-hint { background: #2c2e33; }
      body.editor-dark .syntax-hint code { background: #373a40; }

      body {
        font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        height: 100vh;
        color: var(--text-main);
        overflow: hidden;
      }

      @media (max-width: 768px) {
        body { flex-direction: column; overflow: auto; height: auto; }
        .editor-panel { width: 100% !important; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
        .preview-panel { height: 100vh; }
      }

      .editor-panel {
        width: 420px;
        background-color: var(--panel-bg);
        padding: 25px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        flex-shrink: 0;
        gap: 15px;
        box-shadow: 4px 0 15px var(--shadow);
        z-index: 10;
      }

      /* Expanded textarea mode */
      .editor-expanded .editor-hideable { display: none !important; }
      .editor-expanded textarea { flex: 1; height: auto !important; min-height: 300px; }
      .editor-expanded .textarea-section { flex: 1; display: flex; flex-direction: column; }

      /* Expand button */
      .textarea-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .textarea-header label { margin-bottom: 0; white-space: nowrap; }
      .btn-expand {
        background: var(--input-bg); border: 1px solid var(--border); color: var(--text-sub);
        padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
        font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 4px;
        white-space: nowrap; flex-shrink: 0;
      }
      .btn-expand:hover { background: var(--border); }
      .textarea-section .syntax-hint { margin-top: 0; margin-bottom: 8px; }

      .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
      .title-group { display: flex; align-items: center; gap: 10px; }

      .btn-bread {
        background-color: #fff7ed; border: 1px solid #ffedd5; color: var(--text-main);
        font-size: 1.2rem; padding: 6px 10px; border-radius: 8px; cursor: pointer;
        transition: all 0.2s; display: flex; align-items: center; justify-content: center;
      }
      .btn-bread:hover { background-color: #ffedd5; transform: translateY(-2px); }

      .header-actions { display: flex; gap: 6px; align-items: center; }

      .btn-icon {
        background: var(--input-bg); border: 1px solid var(--border); color: var(--text-sub);
        padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: 0.2s;
      }
      .btn-icon:hover { background: var(--border); }
      .btn-icon.active { background: var(--accent); color: white; border-color: var(--accent); }

      h2 { margin: 0; font-size: 1.2rem; color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }
      label { font-size: 0.85rem; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: 600; }

      select, input, textarea {
        width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border);
        color: var(--text-main); border-radius: 8px; font-size: 0.95rem; transition: all 0.2s;
      }
      textarea { resize: none; line-height: 1.6; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; height: 300px; color: var(--text-main); }
      textarea::placeholder { color: #9ca3af; font-style: italic; }
      textarea:focus, input:focus, select:focus {
        outline: none; border-color: var(--accent); background: var(--panel-bg);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      .keyword-group { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
      .keyword-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
      .keyword-row input { padding: 8px; font-size: 0.9rem; background: #fff; }

      .btn-small { padding: 8px 12px; background: #94a3b8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; transition: 0.2s; }
      .btn-small:hover { background: #64748b; }

      .btn-add { background: #fff; border: 1px dashed #cbd5e1; color: #64748b; width: 100%; margin-top: 5px; transition: 0.2s; }
      .btn-add:hover { background: #f1f5f9; border-color: #94a3b8; }
      .btn-remove { background: #ef4444; color: white; }

      .helper-bar { display: flex; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
      .helper-bar button {
        background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb;
        padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: 0.2s;
      }
      .helper-bar button:hover { background: #dbeafe; transform: translateY(-1px); }

      /* Settings */
      .settings-group {
        background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border);
        display: flex; flex-direction: column; gap: 12px;
      }
      .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .setting-row label { margin-bottom: 0; flex-shrink: 0; min-width: 80px; }
      .setting-row input[type="range"] {
        flex: 1; padding: 0; height: 6px; -webkit-appearance: none; appearance: none;
        background: var(--border); border: none; border-radius: 3px; outline: none;
      }
      .setting-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
        border-radius: 50%; background: var(--accent); cursor: pointer;
      }
      .setting-value { font-size: 0.8rem; color: var(--text-sub); min-width: 40px; text-align: right; font-weight: 600; }
      .setting-row select { width: auto; flex: 1; padding: 8px; font-size: 0.85rem; }

      /* Toggle switch */
      .toggle-row { display: flex; align-items: center; justify-content: space-between; }
      .toggle-row label { margin-bottom: 0; }
      .toggle-switch {
        position: relative; width: 44px; height: 24px; flex-shrink: 0;
      }
      .toggle-switch input { opacity: 0; width: 0; height: 0; }
      .toggle-slider {
        position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
        background-color: #cbd5e1; border-radius: 24px; transition: 0.3s;
      }
      .toggle-slider:before {
        position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
        background-color: white; border-radius: 50%; transition: 0.3s;
      }
      .toggle-switch input:checked + .toggle-slider { background-color: var(--accent); }
      .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }

      .btn-group { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; }
      .btn-main {
        padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        font-size: 1rem; flex: 1; transition: 0.2s; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .btn-save { background-color: var(--accent); }
      .btn-save:hover { background-color: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37,99,235,0.2); }

      .preview-panel { flex: 1; background-color: #e5e7eb; overflow-y: auto; display: flex; padding: 40px; }

      #capture-area {
        width: 100%; max-width: 420px; margin: auto; min-height: 600px;
        display: flex; flex-direction: column; padding: 30px 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1); transition: background 0.3s; background-color: #fff;
      }
      .chat-content { display: flex; flex-direction: column; gap: 12px; }

      .msg-row { display: flex; flex-direction: column; max-width: 100%; cursor: pointer; position: relative; transition: transform 0.1s; }
      .msg-row:active { transform: scale(0.98); }
      .msg-row:hover::after {
        content: "↔ Click to switch"; position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem; padding: 4px 8px; border-radius: 4px;
        pointer-events: none; opacity: 0.8; white-space: nowrap;
      }

      .bubble {
        padding: 12px 18px; border-radius: 18px;
        font-size: var(--bubble-font-size, 15px); line-height: 1.6;
        word-break: break-all; max-width: var(--bubble-max-width, 90%);
        white-space: pre-wrap; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        font-family: var(--bubble-font-family);
      }
      .bubble .dialogue { font-weight: 700; }
      .bubble .italic-text { font-style: italic; }

      .divider-row { display: flex; align-items: center; justify-content: center; padding: 8px 0; gap: 12px; }
      .divider-row .divider-line { flex: 1; height: 1px; background: rgba(128,128,128,0.25); }
      .divider-row .divider-dot { width: 4px; height: 4px; border-radius: 50%; background: rgba(128,128,128,0.35); }

      .syntax-hint {
        font-size: 0.75rem; color: var(--text-sub); margin-top: -8px; line-height: 1.5;
        padding: 8px 10px; background: var(--input-bg); border-radius: 6px; border: 1px solid var(--border);
      }
      .syntax-hint code { background: var(--border); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 0.75rem; }

      .collapsible-header {
        display: flex; align-items: center; justify-content: space-between;
        cursor: pointer; user-select: none; padding: 4px 0;
      }
      .collapsible-header:hover label { color: var(--accent); }
      .collapsible-header .arrow { font-size: 0.7rem; color: var(--text-sub); transition: transform 0.2s; }
      .collapsible-header .arrow.open { transform: rotate(180deg); }
      .collapsible-body { overflow: hidden; transition: max-height 0.3s ease; }
      .collapsible-body.collapsed { max-height: 0 !important; }

      /* ========== THEMES ========== */

      /* 1. KakaoTalk */
      .theme-kakao #capture-area { background: #bacee0; }
      .theme-kakao .msg-row.other { align-items: flex-start; }
      .theme-kakao .msg-row.other .bubble { background: #ffffff; color: #000; border-top-left-radius: 4px; }
      .theme-kakao .msg-row.me { align-items: flex-end; }
      .theme-kakao .msg-row.me .bubble { background: #ffeb33; color: #000; border-top-right-radius: 4px; }
      .theme-kakao .divider-line { background: rgba(0,0,0,0.12); }
      .theme-kakao .divider-dot { background: rgba(0,0,0,0.2); }

      /* 2. iMessage */
      .theme-imessage #capture-area { background: #ffffff; }
      .theme-imessage .msg-row.other { align-items: flex-start; }
      .theme-imessage .msg-row.other .bubble { background: #e5e5ea; color: #000; border-bottom-left-radius: 4px; }
      .theme-imessage .msg-row.me { align-items: flex-end; }
      .theme-imessage .msg-row.me .bubble { background: #007aff; color: #fff; border-bottom-right-radius: 4px; }

      /* 3. Telegram */
      .theme-telegram #capture-area { background: #85a2b6; }

      .theme-telegram .msg-row.other .bubble { background: #ffffff; color: #000; border-bottom-left-radius: 0; }
      .theme-telegram .msg-row.me { align-items: flex-end; }
      .theme-telegram .msg-row.me .bubble { background: #e3feb6; color: #000; border-bottom-right-radius: 0; }

      /* 4. LINE */
      .theme-line #capture-area { background: #92b7ce; }
      .theme-line .msg-row.other { align-items: flex-start; }
      .theme-line .msg-row.other .bubble { background: #ffffff; color: #000; border-top-left-radius: 0; }
      .theme-line .msg-row.me { align-items: flex-end; }
      .theme-line .msg-row.me .bubble { background: #86ea65; color: #000; border-top-right-radius: 0; }

      /* 5. WhatsApp */
      .theme-whatsapp #capture-area { background: #efeae2; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8c2b9' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
      .theme-whatsapp .msg-row.other { align-items: flex-start; }
      .theme-whatsapp .msg-row.other .bubble { background: #ffffff; color: #111b21; border-top-left-radius: 0; }
      .theme-whatsapp .msg-row.me { align-items: flex-end; }
      .theme-whatsapp .msg-row.me .bubble { background: #d9fdd3; color: #111b21; border-top-right-radius: 0; }

      /* 6. X / Twitter */
      .theme-x #capture-area { background: #000000; }
      .theme-x .msg-row.other { align-items: flex-start; }
      .theme-x .msg-row.other .bubble { background: #2f3336; color: #e7e9ea; border-radius: 20px; }
      .theme-x .msg-row.me { align-items: flex-end; }
      .theme-x .msg-row.me .bubble { background: #1d9bf0; color: #fff; border-radius: 20px; }
      .theme-x .divider-line { background: rgba(255,255,255,0.12); }
      .theme-x .divider-dot { background: rgba(255,255,255,0.2); }

      /* 7. Daum Cafe */
      .theme-daum #capture-area { background: #ffffff; }
      .theme-daum .msg-row.other { align-items: flex-start; }
      .theme-daum .msg-row.other .bubble { background: #f0f0f0; color: #000; border-top-left-radius: 0; }
      .theme-daum .msg-row.me { align-items: flex-end; }
      .theme-daum .msg-row.me .bubble { background: #d92525; color: #fff; border-top-right-radius: 0; }

      /* 8. Reddit */
      .theme-reddit #capture-area { background: #ffffff; }
      .theme-reddit .msg-row.other { align-items: flex-start; }
      .theme-reddit .msg-row.other .bubble { background: #dae0e6; color: #000; border-radius: 20px; }
      .theme-reddit .msg-row.me { align-items: flex-end; }
      .theme-reddit .msg-row.me .bubble { background: #ff4500; color: #fff; border-radius: 20px; }

      /* 9. Google */
      .theme-google #capture-area { background: #fffbf5; }
      .theme-google .msg-row.other { align-items: flex-start; }
      .theme-google .msg-row.other .bubble { background: #f2f2f2; color: #1f1f1f; border-radius: 24px; }
      .theme-google .msg-row.me { align-items: flex-end; }
      .theme-google .msg-row.me .bubble { background: #d3e3fd; color: #041e49; border-radius: 24px; }

      /* 10. Slack */
      .theme-slack #capture-area { background: #ffffff; }
      .theme-slack .msg-row.other { align-items: flex-start; }
      .theme-slack .msg-row.other .bubble { background: #f8f8f8; color: #1d1c1d; border-radius: 4px; border-left: 3px solid #e8912d; }
      .theme-slack .msg-row.me { align-items: flex-end; }

      /* 11. Instagram DM */
      .theme-instagram #capture-area { background: #ffffff; }
      .theme-instagram .msg-row.other { align-items: flex-start; }
      .theme-instagram .msg-row.other .bubble { background: #efefef; color: #262626; border-radius: 22px; }
      .theme-instagram .msg-row.me { align-items: flex-end; }

      /* 12. Gemini */

      .theme-chatgpt .msg-row.me { align-items: flex-end; }

  </head>
  <body class="theme-imessage">
    <div class="editor-panel">
      <div class="header-row">
        <div class="title-group">
          <button class="btn-bread" onclick="goHome()" title="홈으로 돌아가기">🍞️</button>
          <h2>로그 생성기 V11</h2>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="darkmode-btn" onclick="toggleEditorDark()" title="에디터 다크모드">🌙</button>
          <button onclick="resetData()" class="btn-small">전체 초기화</button>
        </div>
      </div>

      <div class="editor-hideable">
        <label>🎨 테마 선택</label>
        <select id="theme-select" onchange="changeTheme()">
          <optgroup label="국민 메신저">
            <option value="theme-kakao">카카오톡 (옐로우)</option>
            <option value="theme-imessage">iMessage (블루)</option>
            <option value="theme-line">LINE (연두)</option>
            <option value="theme-telegram">Telegram (민트)</option>
            <option value="theme-whatsapp">WhatsApp (연두)</option>
          </optgroup>
          <optgroup label="SNS / 커뮤니티">
            <option value="theme-x">X (트위터) (블랙)</option>
            <option value="theme-daum">Daum Cafe (레드)</option>
            <option value="theme-reddit">Reddit (오렌지)</option>
            <option value="theme-google">Google (파스텔)</option>
            <option value="theme-slack">Slack (블루)</option>
            <option value="theme-instagram">Instagram DM (그라데이션)</option>
          </optgroup>
          <optgroup label="AI 모델">
            <option value="theme-gemini">Gemini (그라데이션)</option>
            <option value="theme-chatgpt">ChatGPT (청록)</option>
            <option value="theme-claude">Claude (베이지)</option>
            <option value="theme-grok">Grok (오렌지)</option>
          </optgroup>
          <optgroup label="노트앱">
            <option value="theme-applenotes">아이폰 메모</option>
            <option value="theme-evernote">Evernote (그린)</option>
            <option value="theme-notion">Notion (미니멀)</option>
            <option value="theme-wordpress">WordPress (딥블루)</option>
          </optgroup>
        </select>
      </div>

      <div class="editor-hideable">
        <label>치환 키워드</label>
        <div class="helper-bar">
          <button onmousedown="event.preventDefault(); insertToFocused('{{user}}')">+ {{user}}</button>
          <button onmousedown="event.preventDefault(); insertToFocused('{{char}}')">+ {{char}}</button>
          <button onmousedown="event.preventDefault(); insertToFocused('---')">+ 구분선</button>
        </div>
        <div class="keyword-group">
          <div id="keyword-list"></div>
          <button class="btn-small btn-add" onclick="addKeywordRow('', '')">+ 키워드 칸 추가</button>
        </div>
      </div>

      <!-- Collapsible Settings -->
      <div class="editor-hideable">
        <div class="collapsible-header" onclick="toggleCollapsible(this)">
          <label style="cursor:pointer; margin-bottom:0;">⚙️ 세부 설정</label>
          <span class="arrow">▼</span>
        </div>
        <div class="collapsible-body collapsed" style="max-height: 500px;">
          <div class="settings-group" style="margin-top: 8px;">

            <div class="setting-row">
              <label>폰트</label>
              <select id="font-select" onchange="updateFont(this.value)">
                <option value="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">시스템 기본 (Apple)</option>
                <optgroup label="고딕 (산세리프)">
                  <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                  <option value="'Gothic A1', sans-serif">Gothic A1</option>
                  <option value="'IBM Plex Sans KR', sans-serif">IBM Plex Sans KR</option>
                  <option value="'Gowun Dodum', sans-serif">고운돋움</option>
                </optgroup>
                <optgroup label="명조 (세리프)">
                  <option value="'Nanum Myeongjo', serif">나눔명조</option>
                  <option value="'Noto Serif KR', serif">Noto Serif KR</option>
                  <option value="'Gowun Batang', serif">고운바탕</option>
                </optgroup>
              </select>
            </div>

            <div class="setting-row">
              <label>폰트 크기</label>
              <input type="range" min="12" max="22" value="15" id="font-size-range" oninput="updateFontSize(this.value)">
              <span class="setting-value" id="font-size-val">15px</span>
            </div>
            <div class="setting-row">
              <label>말풍선 너비</label>
              <input type="range" min="60" max="100" value="90" id="bubble-width-range" oninput="updateBubbleWidth(this.value)">
              <span class="setting-value" id="bubble-width-val">90%</span>
            </div>
            <div class="setting-row">
              <label>캡처 패딩</label>
              <input type="range" min="10" max="60" value="30" id="capture-padding-range" oninput="updateCapturePadding(this.value)">
              <span class="setting-value" id="capture-padding-val">30px</span>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin: 4px 0;">

            <div class="toggle-row">
              <label>"대사" 굵게</label>
              <label class="toggle-switch">
                <input type="checkbox" id="bold-toggle" checked onchange="render()">
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="toggle-row">
              <label>*기울임*</label>
              <label class="toggle-switch">
                <input type="checkbox" id="italic-toggle" checked onchange="render()">
                <span class="toggle-slider"></span>
              </label>
            </div>

          </div>
        </div>
      </div>

      <div class="textarea-section">
        <div class="textarea-header">
          <label>대화 내용 (ㅏ:나 / ㅓ:상대)</label>
          <button class="btn-expand" id="expand-btn" onclick="toggleExpand()">
            <span id="expand-icon">⤢</span> <span id="expand-text">최대화</span>
          </button>
        </div>
        <div class="syntax-hint editor-hideable">
          <code>"대사"</code> → <b>굵게</b> &nbsp;|&nbsp;
          <code>*기울임*</code> → <i>이탤릭</i> &nbsp;|&nbsp;
          <code>---</code> → 구분선
        </div>
        <textarea
          id="chat-input"
          spellcheck="false"
          oninput="render()"
          onfocus="handleFocus(this)"
          placeholder="(예시 내용은 입력을 시작하면 사라집니다)&#13;&#10;&#13;&#10;ㅏ&#13;&#10;안녕하세요&#13;&#10;ㅓ&#13;&#10;반갑습니다&#13;&#10;---&#13;&#10;ㅏ&#13;&#10;&quot;대사는 굵게&quot;, *이건 기울임*"
        ></textarea>
      </div>

      <div class="btn-group">
        <button class="btn-main btn-save" onclick="saveImage()">📸 이미지 저장</button>
      </div>
    </div>

    <div class="preview-panel">
      <div id="capture-area">
        <div class="chat-content" id="chat-list"></div>
      </div>
    </div>

    <script>
      const EXAMPLE_TEXT = `ㅏ
유저는 박박 우겨서 신부 수트를 입고 아주 편안하게 앉아 있었다.
ㅓ
문을 열자마자 마주한 풍경은 '수줍은 신부'와는 거리가 멀어도 한참 멀었다. 풍성한 드레스 자락 대신 날 선 바지 주름이, 다소곳하게 모은 손 대신 세상 편안하게 늘어진 자세가 시야를 가득 채운다.

"드레스 코드가 바뀐 줄은 몰랐군요. 하객들에게 신랑이 두 명이라고 소개할 셈입니까?"

성큼 다가가 그녀의 맞은편 소파 팔걸이에 삐딱하게 걸터앉으며, 위아래로 훑어보는 시선에 노골적인 평가를 담았다.
ㅏ
"눈이 달려있으면 제가 남자로 보이지는 않겠죠." 유저는 캐릭터의 눈동자를 올곧게 바라보며 피식 웃었다.
ㅓ
"시력은 양쪽 다 1.5니 걱정 마십시오. 다만 하객들이 신랑과 신부를 구분하는 데 1초 정도 더 걸릴 수는 있겠군요."

자리에서 일어나 재킷 단추를 잠그며 턱짓으로 문을 가리켰다.

"그럼 이동하죠. 입장할 시간입니다, 파트너."`;

      const DEFAULT_KEYWORDS = [
        { target: "유저", replace: "{{user}}" },
        { target: "캐릭터", replace: "{{char}}" },
      ];

      let parsedBlocks = [];
      let lastFocusedElem = null;
      let editorDark = false;

      window.onload = function () {
        loadData();
        lastFocusedElem = document.getElementById("chat-input");
      };

      function goHome() { window.location.href = "https://toastout.github.io/toast/"; }

      function handleFocus(elem) {
        setLastFocused(elem);
        if (elem.value.trim() === EXAMPLE_TEXT.trim()) { elem.value = ""; render(); }
      }

      function setLastFocused(elem) { lastFocusedElem = elem; }

      function insertToFocused(text) {
        if (lastFocusedElem) {
          const start = lastFocusedElem.selectionStart;
          const end = lastFocusedElem.selectionEnd;
          const val = lastFocusedElem.value;
          lastFocusedElem.value = val.substring(0, start) + text + val.substring(end);
          lastFocusedElem.selectionStart = lastFocusedElem.selectionEnd = start + text.length;
          lastFocusedElem.focus();
          render();
        } else { alert("입력할 곳을 먼저 클릭해주세요."); }
      }

      function toggleExpand() {
        const panel = document.querySelector('.editor-panel');
        const btn = document.getElementById('expand-btn');
        const icon = document.getElementById('expand-icon');
        const text = document.getElementById('expand-text');
        const isExpanded = panel.classList.toggle('editor-expanded');
        icon.textContent = isExpanded ? '⤡' : '⤢';
        text.textContent = isExpanded ? '최소화' : '최대화';
      }

      function toggleEditorDark() {
        editorDark = !editorDark;
        const btn = document.getElementById("darkmode-btn");
        if (editorDark) {
          document.body.classList.add("editor-dark");
          btn.classList.add("active"); btn.textContent = "☀️";
        } else {
          document.body.classList.remove("editor-dark");
          btn.classList.remove("active"); btn.textContent = "🌙";
        }
        saveData();
      }

      function toggleCollapsible(header) {
        const body = header.nextElementSibling;
        const arrow = header.querySelector(".arrow");
        body.classList.toggle("collapsed");
        arrow.classList.toggle("open");
      }

      function updateFont(val) {
        document.getElementById("capture-area").style.setProperty("--bubble-font-family", val);
        saveData();
      }

      function updateFontSize(val) {
        document.getElementById("font-size-val").textContent = val + "px";
        document.getElementById("capture-area").style.setProperty("--bubble-font-size", val + "px");
        saveData();
      }

      function updateBubbleWidth(val) {
        document.getElementById("bubble-width-val").textContent = val + "%";
        document.getElementById("capture-area").style.setProperty("--bubble-max-width", val + "%");
        saveData();
      }

      function updateCapturePadding(val) {
        document.getElementById("capture-padding-val").textContent = val + "px";
        document.getElementById("capture-area").style.padding = val + "px " + Math.round(val * 0.67) + "px";
        saveData();
      }

      function saveData() {
        const data = {
          text: document.getElementById("chat-input").value,
          theme: document.getElementById("theme-select").value,
          keywords: getKeywordsFromUI(),
          editorDark: editorDark,
          font: document.getElementById("font-select").value,
          fontSize: document.getElementById("font-size-range").value,
          bubbleWidth: document.getElementById("bubble-width-range").value,
          capturePadding: document.getElementById("capture-padding-range").value,
          boldEnabled: document.getElementById("bold-toggle").checked,
          italicEnabled: document.getElementById("italic-toggle").checked,
        };
        localStorage.setItem("novel_gen_v11", JSON.stringify(data));
      }

      function loadData() {
        const saved = localStorage.getItem("novel_gen_v11");
        if (saved) {
          const data = JSON.parse(saved);
          document.getElementById("chat-input").value = data.text || EXAMPLE_TEXT;
          document.getElementById("theme-select").value = data.theme || "theme-imessage";

          const savedKeywords = data.keywords || DEFAULT_KEYWORDS;
          document.getElementById("keyword-list").innerHTML = "";
          savedKeywords.forEach((k) => addKeywordRow(k.target, k.replace));

          if (data.editorDark) { editorDark = false; toggleEditorDark(); }
          if (data.font) {
            document.getElementById("font-select").value = data.font;
            updateFont(data.font);
          }
          if (data.fontSize) {
            document.getElementById("font-size-range").value = data.fontSize;
            updateFontSize(data.fontSize);
          }
          if (data.bubbleWidth) {
            document.getElementById("bubble-width-range").value = data.bubbleWidth;
            updateBubbleWidth(data.bubbleWidth);
          }
          if (data.capturePadding) {
            document.getElementById("capture-padding-range").value = data.capturePadding;
            updateCapturePadding(data.capturePadding);
          }
          if (data.boldEnabled !== undefined) document.getElementById("bold-toggle").checked = data.boldEnabled;
          if (data.italicEnabled !== undefined) document.getElementById("italic-toggle").checked = data.italicEnabled;
        } else {
          document.getElementById("chat-input").value = EXAMPLE_TEXT;
          DEFAULT_KEYWORDS.forEach((k) => addKeywordRow(k.target, k.replace));
        }
        changeTheme();
        render();
      }

      function resetData() {
        if (confirm("초기화 하시겠습니까?")) {
          localStorage.removeItem("novel_gen_v11");
          location.reload();
        }
      }

      function addKeywordRow(target, replace) {
        const div = document.createElement("div");
        div.className = "keyword-row";
        div.innerHTML = `
          <input type="text" placeholder="대상 (예: 유저)" value="${target}" oninput="render()" onfocus="setLastFocused(this)">
          <span style="color:#adb5bd;">→</span>
          <input type="text" placeholder="변경 (예: {{user}})" value="${replace}" oninput="render()" onfocus="setLastFocused(this)">
          <button class="btn-small btn-remove" onclick="removeRow(this)">X</button>
        `;
        document.getElementById("keyword-list").appendChild(div);
      }

      function removeRow(btn) { btn.parentElement.remove(); render(); }

      function getKeywordsFromUI() {
        const rows = document.querySelectorAll(".keyword-row");
        const list = [];
        rows.forEach((row) => {
          const inputs = row.querySelectorAll("input");
          const t = inputs[0].value.trim();
          const r = inputs[1].value.trim();
          if (t) list.push({ target: t, replace: r });
        });
        return list;
      }

      function changeTheme() {
        const theme = document.getElementById("theme-select").value;
        [...document.body.classList].forEach(c => { if (c.startsWith("theme-")) document.body.classList.remove(c); });
        document.body.classList.add(theme);
        saveData();
        render();
      }

      function parseRawText(rawText) {
        const lines = rawText.split("\n");
        let blocks = [];
        let currentSpeaker = "other";
        let buffer = [];

        lines.forEach((line) => {
          const trimmed = line.trim();
          if (trimmed === "ㅏ" || trimmed === "ㅓ") {
            if (buffer.length > 0) {
              blocks.push({ speaker: currentSpeaker, content: buffer.join("\n") });
              buffer = [];
            }
            currentSpeaker = trimmed === "ㅏ" ? "me" : "other";
          } else if (trimmed === "---") {
            if (buffer.length > 0) {
              blocks.push({ speaker: currentSpeaker, content: buffer.join("\n") });
              buffer = [];
            }
            blocks.push({ speaker: "divider", content: "" });
          } else {
            if (buffer.length === 0 && trimmed === "") return;
            buffer.push(line);
          }
        });
        if (buffer.length > 0) {
          blocks.push({ speaker: currentSpeaker, content: buffer.join("\n") });
        }
        return blocks;
      }

      function formatText(text) {
        text = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

        const boldOn = document.getElementById("bold-toggle").checked;
        const italicOn = document.getElementById("italic-toggle").checked;

        if (boldOn) {
          text = text.replace(/&quot;([^&]*?)&quot;/g, '<span class="dialogue">&quot;$1&quot;</span>');
          text = text.replace(/\u201C([^\u201D]*?)\u201D/g, '<span class="dialogue">\u201C$1\u201D</span>');
          text = text.replace(/"([^"]*?)"/g, '<span class="dialogue">\u201C$1\u201D</span>');
          text = text.replace(/「([^」]*?)」/g, '<span class="dialogue">「$1」</span>');
          text = text.replace(/『([^』]*?)』/g, '<span class="dialogue">『$1』</span>');
        }

        if (italicOn) {
          text = text.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<span class="italic-text">$1</span>');
        }

        return text;
      }

      function render() {
        saveData();
        const rawInput = document.getElementById("chat-input").value;
        parsedBlocks = parseRawText(rawInput);

        const chatList = document.getElementById("chat-list");
        chatList.innerHTML = "";

        const keywords = getKeywordsFromUI();

        parsedBlocks.forEach((block, index) => {
          if (block.speaker === "divider") {
            const divRow = document.createElement("div");
            divRow.className = "divider-row";
            divRow.innerHTML = `<div class="divider-line"></div><div class="divider-dot"></div><div class="divider-dot"></div><div class="divider-dot"></div><div class="divider-line"></div>`;
            chatList.appendChild(divRow);
            return;
          }

          let displayText = block.content;
          keywords.forEach((k) => {
            if (k.target && k.replace) displayText = displayText.replaceAll(k.target, k.replace);
          });

          displayText = formatText(displayText);

          const row = document.createElement("div");
          const isMe = block.speaker === "me";
          row.className = isMe ? "msg-row me" : "msg-row other";
          row.onclick = () => toggleSpeaker(index);
          row.innerHTML = `<div class="bubble">${displayText}</div>`;

          chatList.appendChild(row);
        });
      }

      function toggleSpeaker(index) {
        if (!parsedBlocks[index] || parsedBlocks[index].speaker === "divider") return;
        parsedBlocks[index].speaker = parsedBlocks[index].speaker === "me" ? "other" : "me";

        let newText = "";
        parsedBlocks.forEach((block) => {
          if (block.speaker === "divider") { newText += "---\n"; }
          else { newText += (block.speaker === "me" ? "ㅏ\n" : "ㅓ\n") + block.content + "\n"; }
        });

        document.getElementById("chat-input").value = newText.trim();
        render();
      }

      function saveImage() {
        const captureArea = document.getElementById("capture-area");
        window.scrollTo(0, 0);
        const style = window.getComputedStyle(captureArea);

        html2canvas(captureArea, {
          scale: 2, backgroundColor: style.backgroundColor, useCORS: true,
        }).then((canvas) => {
          const imgData = canvas.toDataURL("image/png");
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

          if (isIOS) {
            const win = window.open("", "_blank");
            if (win) {
              win.document.write(`<html><head><title>이미지 저장</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{margin:0;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif}img{max-width:90%;box-shadow:0 4px 15px rgba(0,0,0,.2);border-radius:8px;margin-bottom:20px}p{color:#555;margin-bottom:20px;font-weight:600}.close-btn{padding:10px 20px;background:#333;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}</style></head><body><p>이미지를 길게 눌러 "사진 앱에 저장" 하세요</p><img src="${imgData}" alt="Generated Log"><button class="close-btn" onclick="window.close()">닫기</button></body></html>`);
              win.document.close();
            } else { alert("팝업이 차단되었습니다. 팝업 차단을 해제하고 다시 시도해주세요."); }
          } else {
            const link = document.createElement("a");
            link.download = "novel_log_v11.png";
            link.href = imgData;
            link.click();
          }
        });
      }
    </script>
  </body>
</html>
